<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f7cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KeyHub — маркетплейс цифровых товаров</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
:root{--bg:#0f1420;--panel:#1a2233;--panel2:#222d45;--text:#e8ecf4;--muted:#8b96ad;--accent:#4f7cff;--green:#37c978;--red:#ff5f6d;--gold:#ffd166;--border:#2b3852}
[data-theme="light"]{--bg:#f4f6fb;--panel:#fff;--panel2:#eef2f9;--text:#1a2233;--muted:#5c6a85;--border:#d8dfec}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;transition:background .2s,color .2s}
button{cursor:pointer;font-family:inherit;font-size:14px}
input,select,textarea{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;outline:none;width:100%;font-family:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
a{color:var(--accent);cursor:pointer}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
header.top{background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.bar{display:flex;gap:10px;padding:11px 20px;align-items:center;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;color:var(--text);cursor:pointer;white-space:nowrap}
.logo span{color:var(--accent)}
.grow{flex:1}
.navbtn{background:none;border:none;color:var(--muted);padding:8px 11px;border-radius:8px}
.navbtn:hover{color:var(--text);background:var(--panel2)}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 15px;border-radius:8px;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn.green{background:var(--green);color:#04220f}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ico{position:relative;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:8px}
.cc{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.cc.green{background:var(--green);color:#04220f}
#installBtn{display:none;background:linear-gradient(135deg,var(--accent),var(--green));color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:600;font-size:13px}
#searchWrap{position:relative}
#suggest{position:absolute;top:100%;left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-top:6px;z-index:60;max-height:340px;overflow:auto;display:none}
#suggest.open{display:block}
#suggest .sg{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px}
#suggest .sg:hover{background:var(--panel2)}
#suggest .sg .sic{font-size:22px}
#suggest .sg .sinfo{flex:1}
#suggest .sg .sprice{font-weight:700;color:var(--accent)}
.promo-banner{background:linear-gradient(90deg,rgba(79,124,255,.15),rgba(55,201,120,.15));border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13.5px}
.promo-banner b{color:var(--accent);font-family:Consolas,monospace;font-size:15px}
.promo-banner .copybtn{margin-left:auto;background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:7px;font-weight:600;font-size:13px}
.breadcrumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.hero{text-align:center;padding:32px 0 20px}
.hero h1{font-size:28px;margin-bottom:8px}
.hero p{color:var(--muted);max-width:580px;margin:0 auto}
.stats-row{display:flex;justify-content:center;gap:36px;margin-top:22px;flex-wrap:wrap}
.stats-row .num{font-size:26px;font-weight:800;color:var(--accent)}
.stats-row .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.stats-row .gold{color:var(--gold)}
.viewed{margin-bottom:20px}
.viewed h3{font-size:15px;margin-bottom:10px}
.viewed-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.viewed-card{flex-shrink:0;width:150px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer}
.viewed-card .vi{font-size:28px;text-align:center}
.viewed-card .vt{font-size:12px;font-weight:600;margin:6px 0;line-height:1.3;height:32px;overflow:hidden}
.viewed-card .vp{font-size:13px;font-weight:700}
.cats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0 12px}
.cat{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:999px;font-size:13px}
.cat.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar h3{font-size:15px;margin-right:auto}
.toolbar select{width:auto;min-width:150px;padding:7px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding-bottom:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:.15s;cursor:pointer;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .fav{position:absolute;top:8px;right:8px;background:none;border:none;font-size:17px;padding:4px}
.cmp-chk{position:absolute;top:8px;left:8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;display:flex;align-items:center;gap:5px;cursor:pointer;z-index:2;user-select:none}
.cmp-chk input{width:auto;margin:0;cursor:pointer}
.cmp-chk.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card .ic{font-size:36px}
.card h3{font-size:14px;line-height:1.4;min-height:38px}
.meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.price{font-size:19px;font-weight:700}
.price .old{font-size:12px;color:var(--muted);text-decoration:line-through;margin-left:6px;font-weight:400}
.buy{background:var(--green);color:#04220f;font-weight:700;border:none;padding:9px;border-radius:8px}
.buy:disabled{background:#3a4358;color:var(--muted);cursor:not-allowed}
.badge{align-self:flex-start;background:rgba(55,201,120,.15);color:var(--green);font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin:16px 0}
.panel h2{font-size:19px;margin-bottom:12px}
.panel h3{font-size:15px;margin:16px 0 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel2);border-radius:10px;padding:14px}
.stat b{font-size:22px;display:block}
.stat span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--muted);font-size:12px;background:var(--panel2)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:8px;font-size:13.5px}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.fg{margin-bottom:12px}
.lbl{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.key{background:#0b2417;border:1px solid #1d5c3a;color:#7ee2a8;padding:9px 12px;border-radius:7px;font-family:Consolas,monospace;font-size:12.5px;word-break:break-all;margin-top:6px;position:relative}
.key button{position:absolute;right:6px;top:6px;background:rgba(55,201,120,.2);color:#7ee2a8;padding:3px 8px;border-radius:5px;font-size:11px}
.ci{display:flex;justify-content:space-between;padding:9px 11px;background:var(--panel2);border-radius:8px;margin:5px 0;align-items:center;gap:8px;font-size:13.5px}
.ci button{background:none;border:none;color:var(--red);font-size:15px;padding:0 4px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:#04220f;padding:12px 22px;border-radius:9px;font-weight:600;display:none;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.toast.err{background:var(--red);color:#fff}
.toast.info{background:var(--accent);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal.open{display:flex}
.box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
.drawer{position:fixed;top:0;right:-420px;width:400px;max-width:94vw;height:100%;background:var(--panel);z-index:110;transition:.25s;display:flex;flex-direction:column;border-left:1px solid var(--border)}
.drawer.open{right:0}
.drawer header{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid var(--border)}
.items{flex:1;overflow:auto;padding:12px 14px}
.dfoot{padding:14px;border-top:1px solid var(--border)}
.tot{display:flex;justify-content:space-between;font-size:17px;font-weight:700;margin-bottom:10px}
.notif{position:fixed;top:64px;right:16px;width:320px;max-width:94vw;background:var(--panel);border:1px solid var(--border);border-radius:12px;z-index:120;box-shadow:0 20px 60px rgba(0,0,0,.4);max-height:70vh;overflow:auto;display:none}
.notif.open{display:block}
.notif .item{padding:11px 13px;border-bottom:1px solid var(--border);font-size:13px}
.notif .item.unread{background:rgba(79,124,255,.08)}
.notif .item .time{color:var(--muted);font-size:11px;margin-top:3px}
.notif .head{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel)}
.review{background:var(--panel2);border-radius:10px;padding:11px;margin:7px 0}
.review .head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.review .stars{color:var(--gold)}
.empty{text-align:center;padding:40px;color:var(--muted)}
.empty .big{font-size:46px;margin-bottom:10px;opacity:.4}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:100}
footer{border-top:1px solid var(--border);padding:20px;color:var(--muted);font-size:12.5px;text-align:center;margin-top:40px}
footer a{margin:0 8px;color:var(--muted)}
#burger{display:none}
.mobile-menu{position:fixed;top:0;left:-300px;width:280px;max-width:88vw;height:100%;background:var(--panel);z-index:200;transition:.25s;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:auto}
.mobile-menu.open{left:0}
.mobile-menu .mh{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.mobile-menu button{background:none;border:none;color:var(--text);padding:14px 18px;text-align:left;font-size:14px;border-bottom:1px solid var(--border);width:100%}
.pagination{display:flex;justify-content:center;gap:6px;padding:20px 0 40px;flex-wrap:wrap;align-items:center}
.compare-bar{position:fixed;bottom:20px;left:20px;background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;z-index:90;box-shadow:0 10px 40px rgba(0,0,0,.5);display:none;gap:10px;align-items:center;font-size:13.5px;flex-wrap:wrap;max-width:calc(100vw - 40px)}
.compare-bar.show{display:flex}
.compare-bar b{color:var(--accent)}
.cmp-table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px}
.cmp-table{width:100%;border-collapse:collapse;font-size:13px}
.cmp-table th,.cmp-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;min-width:180px}
.cmp-table th{background:var(--panel2);text-align:center}
.cmp-table td:first-child{color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:600;background:var(--panel2);position:sticky;left:0;z-index:1}
/* === Графики === */
.chart-box{background:var(--panel2);border-radius:12px;padding:16px;margin:12px 0}
.chart-box h4{font-size:13.5px;color:var(--muted);margin-bottom:12px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.linechart{width:100%;height:180px;display:block}
.barchart{display:flex;align-items:flex-end;gap:4px;height:180px;padding:0 4px}
.barchart>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;position:relative}
.barchart .b{width:100%;background:linear-gradient(180deg,var(--accent),var(--green));border-radius:3px 3px 0 0;transition:.2s;min-height:2px}
.barchart .b:hover{filter:brightness(1.3)}
.barchart .lb{font-size:9px;color:var(--muted);margin-top:4px;transform:rotate(-45deg);white-space:nowrap}
.pie{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.pie svg{flex-shrink:0}
.pie-legend{flex:1;min-width:150px}
.pie-legend .li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:12.5px;border-bottom:1px solid var(--border)}
.pie-legend .li:last-child{border:none}
.pie-legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.key-item{display:flex;align-items:center;gap:8px;background:var(--panel2);padding:6px 10px;border-radius:6px;margin:4px 0;font-family:Consolas,monospace;font-size:12px}
.key-item button{background:none;border:none;color:var(--red);padding:2px 6px;cursor:pointer}
@media(max-width:760px){
  #burger{display:inline-flex}
  .desk-nav{display:none!important}
  .bar{gap:6px}
  .logo{font-size:17px}
  #searchWrap{order:10;flex-basis:100%;max-width:none}
  .stats-row .num{font-size:20px}
  .stats-row{gap:14px}
  .panel{padding:14px}
  .box{padding:16px}
  th,td{padding:7px 6px;font-size:12px}
  .hero h1{font-size:22px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .compare-bar{bottom:10px;left:10px;right:10px}
  .linechart{height:140px}
}
</style>
</head>
<body>
<header class="top"><div class="container bar">
  <button id="burger" class="ico" onclick="openMobileMenu()">☰</button>
  <div class="logo" onclick="nav('catalog')">🔑 Key<span>Hub</span></div>
  <div id="searchWrap" style="flex:1;min-width:140px;max-width:340px">
    <input id="searchInp" placeholder="Поиск товаров..." oninput="onSearch()" onfocus="onSearch()" autocomplete="off">
    <div id="suggest"></div>
  </div>
  <div class="row grow desk-nav" style="justify-content:flex-end" id="navArea"></div>
  <div class="row grow" style="justify-content:flex-end">
    <button id="installBtn" onclick="installPWA()">📱 Установить</button>
    <button class="ico" onclick="toggleTheme()" id="themeBtn" title="Тема">🌙</button>
  </div>
</div></header>

<aside class="mobile-menu" id="mobileMenu">
  <div class="mh"><b>🔑 KeyHub</b><button class="ico" onclick="closeMobileMenu()">✕</button></div>
  <div id="mobileNav"></div>
</aside>

<main class="container" id="view"></main>
<footer><div class="container">
  © 2026 KeyHub · <a onclick="nav('faq')">FAQ</a> · <a onclick="nav('offer')">Оферта</a> · <a onclick="nav('privacy')">Конфиденциальность</a> · <a onclick="nav('contacts')">Контакты</a>
</div></footer>

<div class="ovl" id="ovl" onclick="closeAll()"></div>
<aside class="drawer" id="drawer">
  <header><b>🛒 Корзина</b><button class="ico" onclick="closeAll()">✕</button></header>
  <div class="items" id="cartItems"></div>
  <div class="dfoot">
    <div class="row" style="margin-bottom:8px"><input id="promoInp" placeholder="Промокод" style="flex:1"><button class="btn sm" onclick="applyPromo()">OK</button></div>
    <div id="promoMsg" style="font-size:12.5px;margin-bottom:8px"></div>
    <div class="tot"><span>Итого</span><span id="cartTotal">0 ₽</span></div>
    <button class="btn green" style="width:100%" onclick="checkout()">Оплатить</button>
  </div>
</aside>

<div class="notif" id="notifPanel"><div class="head"><b>Уведомления</b><button class="btn sm ghost" onclick="markRead()">Прочитать все</button></div><div id="notifList"></div></div>

<div class="modal" id="authM"><div class="box">
  <div class="tabs"><button class="tab active" id="tL" onclick="authTab('login')">Вход</button><button class="tab" id="tR" onclick="authTab('reg')">Регистрация</button></div>
  <div id="authBody"></div>
</div></div>

<div class="modal" id="infoM"><div class="box" id="infoBody"></div></div>
<div class="modal" id="topupM"><div class="box">
  <h3 style="margin-bottom:14px">Пополнение баланса</h3>
  <div class="fg"><label class="lbl">Сумма, ₽</label><input id="tuSum" type="number" value="1000"></div>
  <div class="row" style="margin-bottom:14px">
    <button class="btn sm ghost" onclick="document.getElementById('tuSum').value=500">500</button>
    <button class="btn sm ghost" onclick="document.getElementById('tuSum').value=1000">1000</button>
    <button class="btn sm ghost" onclick="document.getElementById('tuSum').value=3000">3000</button>
    <button class="btn sm ghost" onclick="document.getElementById('tuSum').value=5000">5000</button>
  </div>
  <button class="btn green" style="width:100%" onclick="doTopup()">Пополнить</button>
</div></div>

<div class="compare-bar" id="compareBar">
  <b>⚖️ Сравнение: <span id="compareCount">0</span>/4</b>
  <button class="btn sm green" onclick="nav('compare')">Сравнить</button>
  <button class="btn sm ghost" onclick="clearCompare()">Очистить</button>
</div>

<div class="toast" id="toast"></div>

<script>
let user=null,products=[],settings={commission:0.05,refRate:0.01,minPayout:500,cashbackRate:0.02,refBuyerRate:0.01,emailEnabled:true},promos=[],notifications=[];
let cart=JSON.parse(localStorage.getItem('pm_cart')||'[]');
let wishlist=JSON.parse(localStorage.getItem('pm_wish')||'[]');
let viewed=JSON.parse(localStorage.getItem('pm_viewed')||'[]');
let compare=JSON.parse(localStorage.getItem('pm_compare')||'[]');
let cv={name:'catalog'},flt={cat:'Все',q:'',sort:'popular',page:1},promoActive=null,sTab='goods',aTab='moderation';
const PER_PAGE=12;
let deferredPrompt=null;

document.documentElement.setAttribute('data-theme',localStorage.getItem('pm_theme')||'dark');

async function api(path,method='GET',body){
  const o={method,credentials:'same-origin',headers:{}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  try{const r=await fetch(path,o);return r.json()}catch(e){return null}
}
function saveCart(){localStorage.setItem('pm_cart',JSON.stringify(cart))}
function saveWish(){localStorage.setItem('pm_wish',JSON.stringify(wishlist))}
function saveViewed(){localStorage.setItem('pm_viewed',JSON.stringify(viewed))}
function saveCompare(){localStorage.setItem('pm_compare',JSON.stringify(compare))}
function toast(m,type){const t=document.getElementById('toast');t.textContent=m;t.className='toast '+(type||'');t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2600)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'));document.getElementById('drawer').classList.remove('open');document.getElementById('ovl').style.display='none';document.getElementById('notifPanel').classList.remove('open');document.getElementById('suggest').classList.remove('open');closeMobileMenu()}
function openM(id){closeAll();document.getElementById(id).classList.add('open')}
function nav(name,data){cv={name,...(data||{})};closeAll();render();window.scrollTo(0,0)}

async function reload(){
  const [u,p,s,pr,n]=await Promise.all([api('/api/me'),api('/api/products'),api('/api/settings'),api('/api/promos'),api('/api/notifications')]);
  user=u;products=p||[];settings=s||settings;promos=pr||[];notifications=n||[];
  updateCompareBar();render();
}

/* PWA */

async function enablePush(){
  if(!('Notification' in window)){toast('Браузер не поддерживает уведомления','err');return}
  if(Notification.permission==='granted'){toast('Уведомления уже включены','info');showPush('KeyHub','Тестовое уведомление');return}
  const perm=await Notification.requestPermission();
  if(perm==='granted'){toast('✓ Уведомления включены');showPush('KeyHub','Уведомления активированы.');}
  else toast('Отклонено','err');
}
async function showPush(title,body){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{const reg=await navigator.serviceWorker.ready;if(reg&&reg.showNotification){reg.showNotification(title,{body,icon:'/icon.svg'});return}}catch(e){}
  try{new Notification(title,{body,icon:'/icon.svg'})}catch(e){}
}

function renderCatalog(v){
  const cats=['Все',...new Set(products.map(p=>p.cat))];
  let list=products.filter(p=>(flt.cat==='Все'||p.cat===flt.cat)).filter(p=>p.title.toLowerCase().includes(flt.q)||p.desc.toLowerCase().includes(flt.q));
  if(flt.sort==='price-asc')list.sort((a,b)=>a.price-b.price);
  else if(flt.sort==='price-desc')list.sort((a,b)=>b.price-a.price);
  else if(flt.sort==='rating')list.sort((a,b)=>b.rating-a.rating);
  else list.sort((a,b)=>b.sales-a.sales);

  const totalSales=products.reduce((s,p)=>s+p.sales,0);
  const avgRating=products.length?(products.reduce((s,p)=>s+p.rating,0)/products.length).toFixed(1):'—';
  const sellersCount=new Set(products.map(p=>p.seller)).size;
  const viewedItems=viewed.map(id=>products.find(p=>p.id===id)).filter(Boolean);

  const totalPages=Math.ceil(list.length/PER_PAGE)||1;
  if(flt.page>totalPages)flt.page=1;
  const start=(flt.page-1)*PER_PAGE;
  const paged=list.slice(start,start+PER_PAGE);
  const gridHTML=paged.map(cardHTML).join('')||'<div class="empty" style="grid-column:1/-1"><div class="big">🔍</div><p>Ничего не найдено</p></div>';
  const btns=[];for(let i=1;i<=totalPages;i++){if(totalPages>7&&i>2&&i<totalPages-1&&Math.abs(i-flt.page)>1){if(btns[btns.length-1]!=='...')btns.push('...');continue}btns.push(i);}
  const pagination=totalPages>1?`<div class="pagination"><button class="btn sm ghost" ${flt.page===1?'disabled':''} onclick="goPage(${flt.page-1})">← Назад</button>${btns.map(b=>b==='...'?`<span class="muted">…</span>`:`<button class="btn sm ${b===flt.page?'':'ghost'}" onclick="goPage(${b})">${b}</button>`).join('')}<button class="btn sm ghost" ${flt.page===totalPages?'disabled':''} onclick="goPage(${flt.page+1})">Вперёд →</button></div>`:'';

  v.innerHTML=`
  <section class="hero"><h1>Цифровые товары от проверенных продавцов</h1><p>Мгновенная выдача · эскроу-защита · кэшбэк ${Math.round(settings.cashbackRate*100)}%</p>
    <div class="stats-row">
      <div><div class="num">${products.length}</div><div class="lbl">товаров</div></div>
      <div><div class="num">${sellersCount}</div><div class="lbl">продавцов</div></div>
      <div><div class="num">${totalSales.toLocaleString('ru-RU')}</div><div class="lbl">продаж</div></div>
      <div><div class="num gold">★ ${avgRating}</div><div class="lbl">средний рейтинг</div></div>
    </div>
  </section>
  ${viewedItems.length?`<div class="viewed"><h3>🕐 Недавно просмотренные</h3><div class="viewed-scroll">${viewedItems.map(p=>`<div class="viewed-card" onclick="openProduct('${p.id}')"><div class="vi">${p.icon}</div><div class="vt">${esc(p.title)}</div><div class="vp">${fmt(p.price)}</div></div>`).join('')}</div></div>`:''}
  ${promos.length?`<div class="promo-banner">🎁 Промокод: <b>${promos[0].code}</b> — ${promos[0].discount}% скидка<button class="copybtn" onclick="navigator.clipboard.writeText('${promos[0].code}');toast('✓ Скопировано')">Копировать</button></div>`:''}
  <div class="cats">${cats.map(c=>`<button class="cat ${c===flt.cat?'active':''}" onclick="flt.cat='${esc(c)}';flt.page=1;renderCatalog(document.getElementById('view'))">${esc(c)}</button>`).join('')}</div>
  <div class="toolbar"><h3>Найдено: ${list.length} · Стр. ${flt.page}/${totalPages}</h3>
    ${compare.length>=2?`<button class="btn sm" onclick="nav('compare')">⚖️ Сравнить (${compare.length})</button>`:''}
    <select onchange="flt.sort=this.value;flt.page=1;renderCatalog(document.getElementById('view'))">
      <option value="popular" ${flt.sort==='popular'?'selected':''}>По популярности</option>
      <option value="price-asc" ${flt.sort==='price-asc'?'selected':''}>Сначала дешёвые</option>
      <option value="price-desc" ${flt.sort==='price-desc'?'selected':''}>Сначала дорогие</option>
      <option value="rating" ${flt.sort==='rating'?'selected':''}>По рейтингу</option>
    </select>
  </div>
  <div class="grid">${gridHTML}</div>${pagination}`;
}

function cardHTML(p){
  const fav=wishlist.includes(p.id);const cmp=compare.includes(p.id);
  const disc=p.old>p.price?Math.round((1-p.price/p.old)*100):0;
  const sellerProducts=products.filter(x=>x.seller===p.seller);
  const sellerRating=sellerProducts.length?(sellerProducts.reduce((s,x)=>s+x.rating,0)/sellerProducts.length).toFixed(1):'—';
  const sellerSales=sellerProducts.reduce((s,x)=>s+x.sales,0);

  return `<div class="card" onclick="openProduct('${p.id}')">
    <label class="cmp-chk ${cmp?'on':''}" onclick="event.stopPropagation()"><input type="checkbox" ${cmp?'checked':''} onchange="toggleCompare('${p.id}')"><span>Сравнить</span></label>

    <div class="ic">${p.icon}</div>

    <div class="meta"><span>⭐ ${p.rating} · ${p.sales} продаж</span></div>
    <div class="meta"><span>${sellerVerified?'✓ ':''}${esc(p.seller)} · ★${sellerRating}</span>${disc?`<span style="color:var(--green);font-weight:600">−${disc}%</span>`:''}</div>
    <div class="price">${fmt(p.price)}${p.old>p.price?`<span class="old">${fmt(p.old)}</span>`:''}</div>
    <button class="buy" ${p.pool.length===0?'disabled':''} onclick="event.stopPropagation();addCart('${p.id}')">${p.pool.length===0?'Нет в наличии':'В корзину'}</button>
  </div>`;
}

    ${row('Скидка',p=>{const d=p.old>p.price?Math.round((1-p.price/p.old)*100):0;return d?`<span style="color:var(--red);font-weight:600">−${d}%</span>`:'—'})}
    ${row('Рейтинг',p=>`<span style="color:var(--gold)">⭐ ${p.rating}</span>`)}

    ${row('В наличии',p=>p.pool.length?`<span style="color:var(--green)">${p.pool.length} шт</span>`:'<span style="color:var(--red)">Нет</span>')}

    <tr><td></td>${items.map(p=>`<td><button class="btn green sm" ${p.pool.length===0?'disabled':''} onclick="addCart('${p.id}')">🛒 В корзину</button></td>`).join('')}</tr>
  </table></div>`;
}

function toggleFav(id){if(wishlist.includes(id)){wishlist=wishlist.filter(x=>x!==id);toast('Удалено','info')}else{wishlist.push(id);toast('❤️ В избранном')}saveWish();render();}

function addCart(id){const p=products.find(x=>x.id===id);if(!p||p.pool.length===0){toast('Нет в наличии','err');return}cart.push(id);saveCart();renderHeader();toast('Добавлено');api('/api/track','POST',{type:'cart',productId:id});}
function openCart(){document.getElementById('drawer').classList.add('open');document.getElementById('ovl').style.display='block';drawCart()}
function drawCart(){
  const items=document.getElementById('cartItems');let total=0;
  items.innerHTML=cart.map((id,i)=>{const p=products.find(x=>x.id===id);if(!p)return '';total+=p.price;return `<div class="ci"><span>${p.icon} ${esc(p.title.slice(0,25))}</span><span>${fmt(p.price)} <button onclick="rmCart(${i})">✕</button></span></div>`}).join('')||'<p class="muted" style="text-align:center;padding:20px">Пусто</p>';
  const disc=promoActive?Math.round(total*promoActive.discount/100):0;
  const cb=Math.round((total-disc)*(settings.cashbackRate||0.02));
  document.getElementById('cartTotal').innerHTML=total?`${fmt(total-disc)}${disc?` <span class="muted" style="font-size:12px;text-decoration:line-through">${fmt(total)}</span>`:''}${cb?`<div style="font-size:11.5px;color:var(--green);text-align:right">+${fmt(cb)} кэшбэк</div>`:''}`:'0 ₽';
}
function rmCart(i){cart.splice(i,1);saveCart();renderHeader();drawCart()}
function applyPromo(){const code=document.getElementById('promoInp').value.trim().toUpperCase();const pr=promos.find(p=>p.code===code);const m=document.getElementById('promoMsg');if(!pr){m.innerHTML='<span style="color:var(--red)">Не найден</span>';promoActive=null;drawCart();return}promoActive={code:pr.code,discount:pr.discount};m.innerHTML=`<span style="color:var(--green)">✓ −${pr.discount}%</span>`;drawCart();}
async function checkout(){
  if(!user){closeAll();openAuth();return}
  if(user.role!=='buyer'){toast('Только покупатели','err');return}
  if(!cart.length){toast('Пусто','err');return}
  const r=await api('/api/orders','POST',{ids:cart,promo:promoActive?promoActive.code:null});

  } else {

  const st=stats||{};const U=allUsers||[];const PR=allProducts||[];const O=allOrders||[];const PY=allPayouts||[];const D=allDisputes||[];const RV=pendingReviews||[];const EM=emails||[];
  let body='';
  if(aTab==='moderation'){
    const pp=PR.filter(p=>p.status==='pending');const od=D.filter(d=>d.status==='open');
    body=`<h3>На модерации (${pp.length})</h3>${pp.length?`<table><tr><th>Товар</th><th>Продавец</th><th>Цена</th><th></th></tr>${pp.map(p=>`<tr><td>${p.icon} ${esc(p.title)}</td><td>${esc(p.seller)}</td><td>${fmt(p.price)}</td><td class="row"><button class="btn sm green" onclick="approveP('${p.id}',1)">✓</button><button class="btn sm red" onclick="approveP('${p.id}',0)">✕</button></td></tr>`).join('')}</table>`:'<p class="muted">Пусто</p>'}
    <h3 style="margin-top:18px">Споры (${od.length})</h3>${od.length?od.map(d=>`<div style="background:var(--panel2);padding:12px;border-radius:10px;margin:8px 0"><div class="row" style="justify-content:space-between"><b>Спор #${d.id}</b><span class="muted">${d.date}</span></div><p style="margin:6px 0">Заказ #${d.orderId} · ${esc(d.title)}</p><p class="muted">${esc(d.buyerName)} · ${esc(d.reason)}</p><p style="margin:6px 0">${esc(d.text)}</p><div class="row"><button class="btn sm green" onclick="resolveD(${d.id},'buyer')">Покупателю</button><button class="btn sm" onclick="resolveD(${d.id},'seller')">Продавцу</button></div></div>`).join(''):'<p class="muted">Пусто</p>'}`;
  } else if(aTab==='reviews'){
    body=`<h3>Отзывы (${RV.length})</h3>${RV.length?RV.map(r=>`<div style="background:var(--panel2);padding:14px;border-radius:10px;margin:10px 0"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div><b>${r.productIcon} ${esc(r.productTitle)}</b></div><div style="color:var(--gold)">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div></div><p class="muted" style="font-size:12.5px;margin-bottom:6px">${esc(r.user)} · ${r.date}</p><p style="margin:8px 0;padding:10px;background:var(--panel);border-radius:8px">${esc(r.text)}</p><div class="row"><button class="btn sm green" onclick="resolveReview('${r.productId}','${r.id}',1)">✓ Опубликовать</button><button class="btn sm red" onclick="resolveReview('${r.productId}','${r.id}',0)">✕ Отклонить</button></div></div>`).join(''):'<p class="muted">Пусто</p>'}`;
  } else if(aTab==='payouts'){
    const pp=PY.filter(p=>p.status==='pending');
    body=`<h3>Выплаты (${pp.length})</h3><table><tr><th>ID</th><th>Дата</th><th>Продавец</th><th>Сумма</th><th></th></tr>${pp.map(p=>`<tr><td>#${p.id}</td><td>${p.date}</td><td>${esc(p.seller)}</td><td>${fmt(p.amount)}</td><td class="row"><button class="btn sm green" onclick="payoutR(${p.id},1)">✓</button><button class="btn sm red" onclick="payoutR(${p.id},0)">✕</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Пусто</td></tr>'}</table>`;
  } else if(aTab==='users'){
    body=`<h3>Пользователи (${U.length})</h3><table><tr><th>Имя</th><th>Email</th><th>Роль</th><th>Баланс</th><th>Статус</th><th></th></tr>${U.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${x.role}</td><td>${fmt(x.balance)}</td><td>${x.blocked?'<span style="color:var(--red)">Блок</span>':'Активен'}</td><td>${x.role!=='admin'?`<button class="btn sm ${x.blocked?'green':'red'}" onclick="blockU('${x.id}')">${x.blocked?'Разблок':'Заблок'}</button>`:''}</td></tr>`).join('')}</table>`;
  } else if(aTab==='orders'){
    body=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><h3 style="margin:0">Заказы (${O.length})</h3><button class="btn sm ghost" onclick="exportOrders()">📥 CSV</button></div><table><tr><th>ID</th><th>Дата</th><th>Покупатель</th><th>Сумма</th><th>Кэшбэк</th><th>Статус</th></tr>${O.map(o=>`<tr><td>#${o.id}</td><td>${o.date}</td><td>${esc(o.buyerName)}</td><td>${fmt(o.total)}</td><td>${o.cashback?fmt(o.cashback):'—'}</td><td>${o.status}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Пусто</td></tr>'}</table>`;
  } else if(aTab==='emails'){
    const st2=st;
    body=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><h3 style="margin:0">📧 Email (${EM.length})</h3><div class="row"><button class="btn sm" onclick="sendTestEmail()">📨 Тест</button><button class="btn sm red" onclick="clearEmails()">Очистить</button></div></div>
    <div class="stats" style="margin-bottom:16px">
      <div class="stat"><b style="color:var(--green)">${st2.emailsSent||0}</b><span>Отправлено</span></div>
      <div class="stat"><b style="color:var(--gold)">${st2.emailsSim||0}</b><span>Симуляция</span></div>
      <div class="stat"><b style="color:var(--red)">${st2.emailsErr||0}</b><span>Ошибок</span></div>
      <div class="stat"><b>${st2.resendConfigured?'✅':'❌'}</b><span>Resend API</span></div>
    </div>
    ${!st2.resendConfigured?`<div style="background:rgba(255,209,102,.1);color:#ffd28a;padding:12px;border-radius:10px;font-size:12.5px;margin-bottom:14px">💡 Для реальной отправки установи переменную <b>RESEND_API_KEY</b> перед запуском сервера. Пока письма выводятся в консоль.</div>`:''}
    ${EM.length?EM.slice(0,30).map(m=>`<div style="background:var(--panel2);padding:12px;border-radius:10px;margin:8px 0">
      <div class="row" style="justify-content:space-between"><b>${esc(m.subject)}</b><span class="badge ${m.status==='sent'?'':m.status==='error'?'':'b-warn'}" style="font-size:10px">${m.status}</span></div>
      <p class="muted" style="font-size:12px;margin-top:4px">${esc(m.to)} · ${m.date} · <span style="color:var(--accent)">${m.type}</span>${m.error?` · <span style="color:var(--red)">${esc(m.error)}</span>`:''}</p>
      <pre style="white-space:pre-wrap;font-family:inherit;font-size:12.5px;margin-top:8px;padding:8px;background:var(--panel);border-radius:6px">${esc(m.text)}</pre>
    </div>`).join(''):'<p class="muted">Писем нет</p>'}`;
  } else {
    body=`<h3>Настройки</h3>
    <div class="row">
      <div class="fg" style="flex:1"><label class="lbl">Комиссия, %</label><input id="sC" type="number" step="0.5" value="${settings.commission*100}"></div>
      <div class="fg" style="flex:1"><label class="lbl">Реф. бонус, %</label><input id="sR" type="number" step="0.5" value="${settings.refRate*100}"></div>
      <div class="fg" style="flex:1"><label class="lbl">Мин. вывод</label><input id="sM" type="number" value="${settings.minPayout}"></div>
    </div>
    <div class="row">
      <div class="fg" style="flex:1"><label class="lbl">Кэшбэк, %</label><input id="sCb" type="number" step="0.1" value="${settings.cashbackRate*100}"></div>
      <div class="fg" style="flex:1"><label class="lbl">Бонус пригласившему, %</label><input id="sRb" type="number" step="0.1" value="${settings.refBuyerRate*100}"></div>
    </div>
    <div class="fg"><label class="lbl"><input type="checkbox" id="sEm" ${settings.emailEnabled?'checked':''} style="width:auto;margin-right:6px"> Включить email</label></div>
    <button class="btn" onclick="saveSettings()">Сохранить</button>
    <div class="stats" style="margin-top:16px">
      <div class="stat"><b style="color:var(--green)">${fmt(st.totalCashback||0)}</b><span>Кэшбэк</span></div>
      <div class="stat"><b style="color:var(--accent)">${fmt(st.totalRef||0)}</b><span>Рефералам</span></div>
      <div class="stat"><b>${st.emailsSent||0}</b><span>Email отправлено</span></div>
    </div>
    <h3 style="margin-top:20px">Промокоды</h3>
    <table><tr><th>Код</th><th>Скидка</th><th>Использован</th><th></th></tr>${promos.map(p=>`<tr><td><b>${p.code}</b></td><td>${p.discount}%</td><td>${p.uses}</td><td><button class="btn sm red" onclick="delPromo('${p.code}')">🗑️</button></td></tr>`).join('')}</table>
    <div class="row" style="margin-top:10px"><input id="npC" placeholder="КОД" style="max-width:120px"><input id="npD" type="number" placeholder="%" style="max-width:80px"><button class="btn sm" onclick="addPromo()">+</button></div>`;
  }
  v.innerHTML=`<div class="panel">
    <h2>⚙️ Админ-панель</h2>
    <div class="stats">
      <div class="stat"><b>${st.users||0}</b><span>Пользователей</span></div>
      <div class="stat"><b>${st.products||0}</b><span>Товаров</span></div>
      <div class="stat"><b>${st.orders||0}</b><span>Заказов</span></div>
      <div class="stat"><b style="color:var(--green)">${fmt(st.revenue||0)}</b><span>Оборот</span></div>
      <div class="stat"><b style="color:var(--gold)">${fmt(st.commission||0)}</b><span>Комиссия</span></div>
    </div>
    <div class="tabs">
      <button class="tab ${aTab==='moderation'?'active':''}" onclick="aTab='moderation';renderAdmin(document.getElementById('view'))">Модерация${st.pendingProducts+st.openDisputes?' ('+(st.pendingProducts+st.openDisputes)+')':''}</button>
      <button class="tab ${aTab==='reviews'?'active':''}" onclick="aTab='reviews';renderAdmin(document.getElementById('view'))">📝 Отзывы${st.pendingReviews?' ('+st.pendingReviews+')':''}</button>
      <button class="tab ${aTab==='payouts'?'active':''}" onclick="aTab='payouts';renderAdmin(document.getElementById('view'))">Выплаты${st.pendingPayouts?' ('+st.pendingPayouts+')':''}</button>
      <button class="tab ${aTab==='users'?'active':''}" onclick="aTab='users';renderAdmin(document.getElementById('view'))">Юзеры</button>
      <button class="tab ${aTab==='orders'?'active':''}" onclick="aTab='orders';renderAdmin(document.getElementById('view'))">Заказы</button>
      <button class="tab ${aTab==='emails'?'active':''}" onclick="aTab='emails';renderAdmin(document.getElementById('view'))">📧 Email</button>
      <button class="tab ${aTab==='settings'?'active':''}" onclick="aTab='settings';renderAdmin(document.getElementById('view'))">Настройки</button>
    </div>${body}</div>`;
}
async function approveP(id,approve){await api('/api/admin/products/approve','POST',{id,approve});toast(approve?'Одобрено':'Отклонено');await reload();renderAdmin(document.getElementById('view'))}
async function payoutR(id,approve){await api('/api/admin/payouts/resolve','POST',{id,approve});toast('Готово');await reload();renderAdmin(document.getElementById('view'))}
async function blockU(id){await api('/api/admin/users/block','POST',{id});await reload();renderAdmin(document.getElementById('view'))}
async function resolveD(id,winner){await api('/api/admin/disputes/resolve','POST',{id,winner});toast('Спор решён');await reload();renderAdmin(document.getElementById('view'))}
async function resolveReview(productId,id,approve){await api('/api/admin/reviews/resolve','POST',{productId,id,approve});toast(approve?'✓ Опубликован':'Отклонён','info');await reload();renderAdmin(document.getElementById('view'))}
async function saveSettings(){
  await api('/api/admin/settings','POST',{
    commission:+document.getElementById('sC').value/100,
    refRate:+document.getElementById('sR').value/100,
    minPayout:+document.getElementById('sM').value,
    cashbackRate:+document.getElementById('sCb').value/100,
    refBuyerRate:+document.getElementById('sRb').value/100,
    emailEnabled:document.getElementById('sEm').checked
  });
  settings=await api('/api/settings');toast('✓ Сохранено');
}
async function addPromo(){const code=document.getElementById('npC').value.trim().toUpperCase();const discount=+document.getElementById('npD').value;const r=await api('/api/promos/add','POST',{code,discount,limit:0});if(!r||r.error){toast((r&&r.error)||'Ошибка','err');return}promos=await api('/api/promos');toast('✓ Добавлен');renderAdmin(document.getElementById('view'))}
async function delPromo(code){if(!confirm('Удалить?'))return;await api('/api/promos/delete','POST',{code});promos=await api('/api/promos');renderAdmin(document.getElementById('view'))}
async function sendTestEmail(){const to=prompt('Email получателя:','buyer@demo.ru');if(!to)return;await api('/api/admin/test-email','POST',{to});toast('✓ Отправлено (см. консоль)');await reload();renderAdmin(document.getElementById('view'))}
async function clearEmails(){if(!confirm('Очистить?'))return;await api('/api/admin/emails/clear','POST');toast('Очищено','info');await reload();renderAdmin(document.getElementById('view'))}
function exportOrders(){
  api('/api/admin/orders').then(orders=>{
    if(!orders||!orders.length){toast('Нет заказов','err');return}
    const rows=[['ID','Дата','Покупатель','Товары','Сумма','Кэшбэк','Комиссия','Статус']];
    orders.forEach(o=>rows.push([o.id,o.date,o.buyerName,(o.items||[]).map(i=>i.title).join('; '),o.total,o.cashback||0,o.commission||0,o.status]));
    const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='keyhub_orders.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);toast('✓ Экспортировано');
  });
}

/* АВТОРИЗАЦИЯ */
function openAuth(){const ref=new URLSearchParams(location.search).get('ref')||'';openM('authM');authTab('login',ref)}
function authTab(m,ref){ref=ref||new URLSearchParams(location.search).get('ref')||'';document.getElementById('tL').classList.toggle('active',m==='login');document.getElementById('tR').classList.toggle('active',m==='reg');const b=document.getElementById('authBody');
  if(m==='login'){b.innerHTML=`<div class="fg"><label class="lbl">Email</label><input id="lE" value="buyer@demo.ru"></div><div class="fg"><label class="lbl">Пароль</label><input id="lP" type="password" value="buyer"></div><button class="btn" style="width:100%" onclick="doLogin()">Войти</button><p class="muted" style="font-size:12px;margin-top:12px;text-align:center;line-height:1.7">buyer@demo.ru / buyer<br>seller@demo.ru / seller<br>admin@demo.ru / admin</p>`;}
  else{b.innerHTML=`<div class="fg"><label class="lbl">Имя</label><input id="rN"></div><div class="fg"><label class="lbl">Email</label><input id="rE" type="email"></div><div class="fg"><label class="lbl">Пароль</label><input id="rP" type="password"></div><div class="fg"><label class="lbl">Роль</label><select id="rR"><option value="buyer">Покупатель</option><option value="seller">Продавец</option></select></div><div class="fg"><label class="lbl">Реф. код</label><input id="rRef" value="${esc(ref)}"></div><button class="btn green" style="width:100%" onclick="doRegister()">Создать</button>`;}
}
async function doLogin(){const r=await api('/api/login','POST',{email:document.getElementById('lE').value,pass:document.getElementById('lP').value});if(!r||r.error){toast((r&&r.error)||'Ошибка','err');return}closeAll();toast('Добро пожаловать, '+r.name);await reload();}
async function doRegister(){const r=await api('/api/register','POST',{name:document.getElementById('rN').value,email:document.getElementById('rE').value,pass:document.getElementById('rP').value,role:document.getElementById('rR').value,ref:document.getElementById('rRef').value});if(!r||r.error){toast((r&&r.error)||'Ошибка','err');return}closeAll();toast('Аккаунт создан');await reload();}
async function logout(){await api('/api/logout','POST');cart=[];saveCart();user=null;toast('Вы вышли');nav('catalog');reload()}
async function doTopup(){const sum=+document.getElementById('tuSum').value;const r=await api('/api/topup','POST',{sum});if(!r||r.error){toast((r&&r.error)||'Ошибка','err');return}closeAll();user=await api('/api/me');toast('✓ Пополнено');renderHeader();}
function openSettings(){openM('infoM');document.getElementById('infoBody').innerHTML=`<h3>Настройки</h3><div class="fg"><label class="lbl">Имя</label><input id="stN" value="${esc(user.name)}"></div><button class="btn green" style="width:100%" onclick="saveProfile()">Сохранить</button><h3 style="margin-top:20px">Смена пароля</h3><div class="fg"><label class="lbl">Текущий</label><input id="stO" type="password"></div><div class="fg"><label class="lbl">Новый</label><input id="stP" type="password"></div><button class="btn" style="width:100%" onclick="changePass()">Сменить</button><h3 style="margin-top:20px">Уведомления</h3><button class="btn ghost" style="width:100%" onclick="enablePush()">📢 Включить push</button>`;}
async function saveProfile(){const r=await api('/api/settings','POST',{name:document.getElementById('stN').value.trim()});if(!r||r.error){toast((r&&r.error)||'Ошибка','err');return}user=r;closeAll();toast('✓ Сохранено');renderHeader();}
async function changePass(){const r=await api('/api/settings','POST',{oldPass:document.getElementById('stO').value,newPass:document.getElementById('stP').value});if(!r||r.error){toast((r&&r.error)||'Ошибка','err');return}closeAll();toast('✓ Пароль изменён');}

function openNotif(e){e.stopPropagation();const p=document.getElementById('notifPanel');p.classList.toggle('open');if(p.classList.contains('open'))document.getElementById('notifList').innerHTML=notifications.length?notifications.map(n=>`<div class="item ${n.read?'':'unread'}">${esc(n.text)}<div class="time">${n.date}</div></div>`).join(''):'<div class="item muted">Пусто</div>';}
async function markRead(){await api('/api/notifications/read','POST');notifications=await api('/api/notifications');renderHeader();document.getElementById('notifList').innerHTML=notifications.map(n=>`<div class="item ${n.read?'':'unread'}">${esc(n.text)}<div class="time">${n.date}</div></div>`).join('')||'<div class="item muted">Пусто</div>';}

function renderStatic(v,page){
  const data={
    faq:{title:'FAQ',body:`<h3>Как получить товар?</h3><p class="muted" style="margin-bottom:10px">Автоматически после оплаты — в «Моих покупках».</p>
      <h3>Кэшбэк?</h3><p class="muted" style="margin-bottom:10px">${Math.round(settings.cashbackRate*100)}% от заказа на баланс.</p>
      <h3>Партнёрка?</h3><p class="muted" style="margin-bottom:10px">${Math.round(settings.refBuyerRate*100)}% с покупок приглашённых.</p>
      <h3>Как установить приложение?</h3><p class="muted" style="margin-bottom:10px">В Chrome на телефоне — «Установить» в шапке или меню браузера.</p>`},
    offer:{title:'Оферта',body:`<p class="muted" style="line-height:1.7">Публичная оферта о купле-продаже цифровых товаров. Эскроу 3 дня.</p>`},
    privacy:{title:'Конфиденциальность',body:`<p class="muted" style="line-height:1.7">Храним email, имя и историю заказов для оказания услуг.</p>`},
    contacts:{title:'Контакты',body:`<p><b>Email:</b> support@keyhub.io</p><p style="margin-top:8px"><b>Telegram:</b> @keyhub_support</p>`}
  }[page];
  v.innerHTML=`<div class="panel"><h2>${data.title}</h2>${data.body}</div>`;
}

document.addEventListener('click',e=>{const p=document.getElementById('notifPanel');if(p&&!p.contains(e.target)&&!e.target.closest('button[onclick^="openNotif"]'))p.classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();document.getElementById('searchInp').focus()}});

const themeBtn=document.getElementById('themeBtn');
themeBtn.textContent=(localStorage.getItem('pm_theme')||'dark')==='dark'?'🌙':'☀️';

reload();
</script>
</body>
</html>
