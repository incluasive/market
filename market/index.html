<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlatiMarket</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0f1420;color:#e8ecf4;font-size:14px}
button{cursor:pointer;border:none;font-family:inherit;font-size:14px}
input,select,textarea{background:#222d45;border:1px solid #2b3852;color:#e8ecf4;padding:10px;border-radius:8px;outline:none;font-size:14px;width:100%;font-family:inherit}
header{background:#1a2233;border-bottom:1px solid #2b3852;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.container{max-width:1100px;margin:0 auto;padding:20px}
.logo{font-size:20px;font-weight:800;color:#4f7cff;cursor:pointer}
.btn{background:#4f7cff;color:#fff;padding:10px 16px;border-radius:8px;font-weight:600}
.btn.green{background:#37c978;color:#04220f}
.btn.red{background:#ff5f6d;color:#fff}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:hover{filter:brightness(1.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:#1a2233;border:1px solid #2b3852;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card .ic{font-size:40px}
.card h3{font-size:14px;min-height:38px;line-height:1.4}
.price{font-size:20px;font-weight:700}
.price .old{font-size:12px;color:#8b96ad;text-decoration:line-through;margin-left:6px;font-weight:400}
.panel{background:#1a2233;border:1px solid #2b3852;border-radius:12px;padding:20px;margin:16px 0}
.muted{color:#8b96ad}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{background:#222d45;color:#8b96ad;padding:8px 14px;border-radius:8px}
.tab.active{background:#4f7cff;color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.ci{display:flex;justify-content:space-between;padding:8px;background:#222d45;border-radius:8px;margin:4px 0;align-items:center}
.key{background:#0b2417;color:#7ee2a8;padding:8px 12px;border-radius:6px;font-family:Consolas,monospace;font-size:12px;word-break:break-all;margin-top:4px;position:relative}
.key button{position:absolute;right:6px;top:6px;background:rgba(55,201,120,.2);color:#7ee2a8;padding:3px 8px;border-radius:5px;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal.open{display:flex}
.box{background:#1a2233;border:1px solid #2b3852;border-radius:12px;padding:24px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.fg{margin-bottom:12px}
.lbl{font-size:12px;color:#8b96ad;display:block;margin-bottom:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#37c978;color:#04220f;padding:12px 20px;border-radius:8px;font-weight:600;display:none;z-index:200}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #2b3852;text-align:left}
th{color:#8b96ad;font-size:12px}
.cart-bar{position:fixed;bottom:20px;right:20px;background:#1a2233;border:1px solid #4f7cff;border-radius:12px;padding:14px;width:320px;max-width:94vw;z-index:60;box-shadow:0 10px 40px rgba(0,0,0,.5)}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="showCatalog()">⚡ PlatiMarket</div>
  <div class="grow"></div>
  <div id="userArea" class="row"></div>
</header>
<main class="container" id="view"></main>

<div class="modal" id="authM"><div class="box">
  <div class="tabs">
    <button class="tab active" id="tL" onclick="switchAuth('login')">Вход</button>
    <button class="tab" id="tR" onclick="switchAuth('reg')">Регистрация</button>
  </div>
  <div id="authBody"></div>
</div></div>

<div class="modal" id="topupM"><div class="box">
  <h2 style="margin-bottom:14px">Пополнение баланса</h2>
  <div class="fg"><label class="lbl">Сумма, ₽</label><input id="tuS" type="number" value="1000"></div>
  <div class="row" style="margin-bottom:14px">
    <button class="btn sm" onclick="document.getElementById('tuS').value=500">500</button>
    <button class="btn sm" onclick="document.getElementById('tuS').value=1000">1000</button>
    <button class="btn sm" onclick="document.getElementById('tuS').value=3000">3000</button>
    <button class="btn sm" onclick="document.getElementById('tuS').value=5000">5000</button>
  </div>
  <button class="btn green" style="width:100%" onclick="doTopUp()">Пополнить</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
let user = null;
let products = [];
let cart = [];

async function api(path, method, body) {
  method = method || 'GET';
  const opts = {method: method, credentials: 'same-origin'};
  if (body) {
    opts.headers = {'Content-Type': 'application/json'};
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  return r.json();
}

function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isErr ? '#ff5f6d' : '#37c978';
  t.style.color = isErr ? '#fff' : '#04220f';
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.style.display = 'none', 2600);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function reload() {
  user = await api('/api/me');
  products = await api('/api/products');
  renderUserArea();
  showCatalog();
}

function renderUserArea() {
  const a = document.getElementById('userArea');
  if (!user) {
    a.innerHTML = '<button class="btn sm" onclick="openAuth()">Войти</button>';
    return;
  }
  a.innerHTML =
    '<span class="muted">' + esc(user.name) + ' · ' + user.balance.toLocaleString('ru') + ' ₽</span>' +
    '<button class="btn sm" onclick="openTopUp()">+ Баланс</button>' +
    (user.role === 'seller' ? '<button class="btn sm" onclick="showSeller()">Кабинет</button>' : '') +
    '<button class="btn sm" onclick="showOrders()">Заказы</button>' +
    '<button class="btn sm red" onclick="logout()">Выйти</button>';
}

function showCatalog() {
  const v = document.getElementById('view');
  v.innerHTML = '<h1 style="margin-bottom:16px">Каталог товаров</h1>' +
    '<div class="grid">' +
    products.map(p =>
      '<div class="card">' +
        '<div class="ic">' + p.icon + '</div>' +
        '<h3>' + esc(p.title) + '</h3>' +
        '<div class="muted" style="font-size:12px">⭐ ' + p.rating + ' · ' + p.sales + ' продаж · ' + esc(p.seller) + '</div>' +
        '<div class="price">' + p.price.toLocaleString('ru') + ' ₽' +
          (p.old > p.price ? '<span class="old">' + p.old.toLocaleString('ru') + ' ₽</span>' : '') +
        '</div>' +
        '<button class="btn green" onclick="addCart(\'' + p.id + '\')">В корзину</button>' +
      '</div>'
    ).join('') +
    '</div>' +
    renderCartBar();
}

function renderCartBar() {
  const old = document.getElementById('cartBar');
  if (old) old.remove();
  if (!cart.length) return;

  const total = cart.reduce((s, id) => {
    const p = products.find(x => x.id === id);
    return s + (p ? p.price : 0);
  }, 0);

  const bar = document.createElement('div');
  bar.id = 'cartBar';
  bar.className = 'cart-bar';
  bar.innerHTML =
    '<div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>🛒 Корзина (' + cart.length + ')</b><button class="btn sm red" onclick="clearCart()">Очистить</button></div>' +
    cart.map((id, i) => {
      const p = products.find(x => x.id === id);
      return p ? '<div class="ci"><span>' + p.icon + ' ' + esc(p.title.slice(0, 22)) + '</span><button class="btn sm red" onclick="rmCart(' + i + ')">✕</button></div>' : '';
    }).join('') +
    '<div style="margin-top:10px;font-weight:700;font-size:16px">Итого: ' + total.toLocaleString('ru') + ' ₽</div>' +
    '<button class="btn green" style="width:100%;margin-top:8px" onclick="checkout()">Оплатить</button>';

  document.body.appendChild(bar);
}

function addCart(id) {
  cart.push(id);
  showCatalog();
  toast('Добавлено в корзину');
}

function rmCart(i) {
  cart.splice(i, 1);
  showCatalog();
}

function clearCart() {
  cart = [];
  showCatalog();
}

async function checkout() {
  if (!user) { openAuth(); return; }
  const r = await api('/api/orders', 'POST', {ids: cart});
  if (r.error) { toast(r.error, true); return; }
  cart = [];
  toast('✓ Оплачено! Ключи в разделе «Заказы»');
  user = await api('/api/me');
  renderUserArea();
  showOrders();
}

async function showOrders() {
  const orders = await api('/api/orders');
  const v = document.getElementById('view');
  const old = document.getElementById('cartBar');
  if (old) old.remove();

  v.innerHTML = '<h1 style="margin-bottom:16px">Мои заказы</h1>' +
    (orders.length ? orders.map(o =>
      '<div class="panel">' +
        '<b>Заказ #' + o.id + '</b> · ' + new Date(o.date).toLocaleString('ru') +
        '<div style="margin-top:10px">' +
        o.items.map(it =>
          '<div style="margin-bottom:8px">' +
            '<div class="ci"><span>' + esc(it.title) + '</span><span>' + it.price.toLocaleString('ru') + ' ₽</span></div>' +
            '<div class="key">' + esc(it.item) + '<button onclick="copyKey(this)">Копировать</button></div>' +
          '</div>'
        ).join('') +
        '</div>' +
        '<div style="margin-top:8px;font-weight:700">Итого: ' + o.total.toLocaleString('ru') + ' ₽</div>' +
      '</div>'
    ).join('') : '<div class="panel muted">Заказов пока нет</div>');
}

function copyKey(btn) {
  const k = btn.parentElement.childNodes[0].textContent.trim();
  navigator.clipboard.writeText(k).then(() => {
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = 'Копировать', 1200);
  });
}

function showSeller() {
  const old = document.getElementById('cartBar');
  if (old) old.remove();
  const v = document.getElementById('view');
  v.innerHTML =
    '<h1 style="margin-bottom:16px">Кабинет продавца</h1>' +
    '<div class="panel">' +
      '<h3 style="margin-bottom:14px">Добавить товар</h3>' +
      '<div class="fg"><label class="lbl">Название</label><input id="nT" placeholder="Steam Key: Название"></div>' +
      '<div class="row">' +
        '<div class="fg grow"><label class="lbl">Цена, ₽</label><input id="nP" type="number"></div>' +
        '<div class="fg grow"><label class="lbl">Старая цена</label><input id="nO" type="number"></div>' +
        '<div class="fg grow"><label class="lbl">Иконка</label><input id="nI" value="🎮" maxlength="4"></div>' +
      '</div>' +
      '<div class="fg"><label class="lbl">Описание</label><input id="nD"></div>' +
      '<div class="fg"><label class="lbl">Ключи / товарные единицы (по одному в строке)</label>' +
        '<textarea id="nK" rows="4"></textarea></div>' +
      '<button class="btn green" onclick="addProduct()">Опубликовать товар</button>' +
    '</div>';
}

async function addProduct() {
  const body = {
    title: document.getElementById('nT').value.trim(),
    price: +document.getElementById('nP').value,
    old: +document.getElementById('nO').value,
    icon: document.getElementById('nI').value.trim(),
    desc: document.getElementById('nD').value.trim(),
    pool: document.getElementById('nK').value
  };
  const r = await api('/api/products', 'POST', body);
  if (r.error) { toast(r.error, true); return; }
  toast('✓ Товар опубликован');
  products = await api('/api/products');
  showSeller();
}

function openAuth() {
  document.getElementById('authM').classList.add('open');
  switchAuth('login');
}

function switchAuth(mode) {
  document.getElementById('tL').classList.toggle('active', mode === 'login');
  document.getElementById('tR').classList.toggle('active', mode === 'reg');
  const b = document.getElementById('authBody');
  if (mode === 'login') {
    b.innerHTML =
      '<div class="fg"><label class="lbl">Email</label><input id="aE" value="buyer@demo.ru"></div>' +
      '<div class="fg"><label class="lbl">Пароль</label><input id="aP" type="password" value="buyer"></div>' +
      '<button class="btn" style="width:100%" onclick="doLogin()">Войти</button>' +
      '<p class="muted" style="font-size:12px;margin-top:12px;text-align:center;line-height:1.6">' +
        'buyer@demo.ru / buyer · seller@demo.ru / seller · admin@demo.ru / admin' +
      '</p>';
  } else {
    b.innerHTML =
      '<div class="fg"><label class="lbl">Имя</label><input id="rN"></div>' +
      '<div class="fg"><label class="lbl">Email</label><input id="rE" type="email"></div>' +
      '<div class="fg"><label class="lbl">Пароль (мин. 4)</label><input id="rP" type="password"></div>' +
      '<div class="fg"><label class="lbl">Роль</label><select id="rR"><option value="buyer">Покупатель</option><option value="seller">Продавец</option></select></div>' +
      '<button class="btn green" style="width:100%" onclick="doRegister()">Создать аккаунт</button>';
  }
}

async function doLogin() {
  const r = await api('/api/login', 'POST', {
    email: document.getElementById('aE').value,
    pass: document.getElementById('aP').value
  });
  if (r.error) { toast(r.error, true); return; }
  user = r;
  document.getElementById('authM').classList.remove('open');
  renderUserArea();
  toast('Добро пожаловать, ' + r.name);
  showCatalog();
}

async function doRegister() {
  const r = await api('/api/register', 'POST', {
    name: document.getElementById('rN').value,
    email: document.getElementById('rE').value,
    pass: document.getElementById('rP').value,
    role: document.getElementById('rR').value
  });
  if (r.error) { toast(r.error, true); return; }
  user = r;
  document.getElementById('authM').classList.remove('open');
  renderUserArea();
  toast('Аккаунт создан');
  showCatalog();
}

async function logout() {
  await api('/api/logout', 'POST');
  user = null;
  cart = [];
  renderUserArea();
  showCatalog();
  toast('Вы вышли');
}

function openTopUp() {
  document.getElementById('topupM').classList.add('open');
}

async function doTopUp() {
  const sum = +document.getElementById('tuS').value;
  const r = await api('/api/topup', 'POST', {sum});
  if (r.error) { toast(r.error, true); return; }
  user.balance = r.balance;
  document.getElementById('topupM').classList.remove('open');
  renderUserArea();
  toast('Баланс пополнен');
}

document.getElementById('authM').addEventListener('click', e => {
  if (e.target.id === 'authM') e.target.classList.remove('open');
});
document.getElementById('topupM').addEventListener('click', e => {
  if (e.target.id === 'topupM') e.target.classList.remove('open');
});

reload();
</script>
</body>
</html>
